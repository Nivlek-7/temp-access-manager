services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  backend:
    build:
      target: development
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ./backend/pom.xml:/app/pom.xml:ro
      - ./backend/src:/app/src

  frontend:
    build:
      target: development
    ports: !override
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/login >/dev/null"]

volumes:
  frontend_node_modules:
